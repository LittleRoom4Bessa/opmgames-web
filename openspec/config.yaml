schema: spec-driven

context: |
  Tech stack: Astro (static, content collections), plain CSS design system, deployed to GitHub Pages via a protected `release` branch.
  Bilingual site (en/zh): blog posts declare `lang`; translations use `translationOf`.
  Editorial rule: no unearned claims — identity copy must be backed by shipped work.
  Workflow: feature work on `dev`, owner reviews visually, merge to `main`, deploy via release PR (merge commit).

